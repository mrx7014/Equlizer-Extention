<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equalizer Extension</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 330px; margin: 0; padding: 14px; font-family: system-ui, sans-serif; background: #14141c; color: #eee; }
    h1 { font-size: 17px; margin: 0 0 3px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .subtitle { color: #8f98aa; font-size: 11px; margin-bottom: 12px; }
    h2 { font-size: 12px; color: #8ab4ff; margin: 14px 0 6px; letter-spacing: .4px; }
    .row { display: grid; grid-template-columns: 92px 1fr 42px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
    .value { text-align: left; color: #aaa; font-variant-numeric: tabular-nums; direction: ltr; }
    input[type=range] { width: 100%; accent-color: #8ab4ff; }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
    button { background: #262636; color: #eee; border: 1px solid #3a3a52; border-radius: 8px; padding: 6px 9px; cursor: pointer; font-size: 12px; }
    button:hover, button:focus-visible { background: #32324a; outline: none; border-color: #8ab4ff; }
    .switch { font-size: 12px; display: flex; gap: 6px; align-items: center; color: #b9d0ff; }
    .hint { color: #777f91; font-size: 11px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <h1>🎧 Equalizer Extension <label class="switch"><input type="checkbox" id="enabled"> On</label></h1>
  <div class="subtitle">Echo, reverb, bass, and more for YouTube</div>

  <h2>Original Sound</h2>
  <div class="row"><span>Dry level</span><input type="range" id="dry" min="0" max="1.5" step="0.01"><span class="value" id="dry-value"></span></div>

  <h2>Bass</h2>
  <div class="row"><span>Bass (dB)</span><input type="range" id="bass" min="-12" max="20" step="0.5"><span class="value" id="bass-value"></span></div>
  <div class="row"><span>Frequency (Hz)</span><input type="range" id="bassFreq" min="40" max="300" step="5"><span class="value" id="bassFreq-value"></span></div>

  <h2>Reverb</h2>
  <div class="row"><span>Mix</span><input type="range" id="reverbMix" min="0" max="1.5" step="0.01"><span class="value" id="reverbMix-value"></span></div>
  <div class="row"><span>Decay (sec)</span><input type="range" id="reverbDecay" min="0.3" max="8" step="0.1"><span class="value" id="reverbDecay-value"></span></div>
  <div class="row"><span>Damping</span><input type="range" id="reverbDamping" min="0" max="1" step="0.01"><span class="value" id="reverbDamping-value"></span></div>

  <h2>Echo</h2>
  <div class="row"><span>Mix</span><input type="range" id="echoMix" min="0" max="1.5" step="0.01"><span class="value" id="echoMix-value"></span></div>
  <div class="row"><span>Delay (sec)</span><input type="range" id="echoTime" min="0.05" max="1.5" step="0.01"><span class="value" id="echoTime-value"></span></div>
  <div class="row"><span>Feedback</span><input type="range" id="echoFeedback" min="0" max="0.9" step="0.01"><span class="value" id="echoFeedback-value"></span></div>

  <div class="presets" aria-label="Presets">
    <button data-preset="daily">Daily</button>
    <button data-preset="music">Music</button>
    <button data-preset="mosque">Mosque</button>
    <button data-preset="big">Big</button>
    <button data-preset="hall">Hall</button>
    <button data-preset="cave">Cave</button>
    <button data-preset="slap">Slapback</button>
    <button data-preset="space">Space</button>
    <button data-preset="bass">Bass Boost</button>
    <button data-preset="reset">Reset</button>
  </div>
  <p class="hint">Play a YouTube video once after opening the extension if you do not hear a difference.</p>
  <script src="popup.js"></script>
</body>
</html>
